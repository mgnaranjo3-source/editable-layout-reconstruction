<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- Editable reconstruction built from flyer-layout.json: every element is a separate, named, editable object -->
  <rect id="canvas-background" x="0" y="0" width="800" height="1000" fill="#FFF8EE"/>

  <g id="header">
    <rect id="header-band" x="0" y="0" width="800" height="220" fill="#1F4E5F"/>
    <text id="title" x="400" y="120" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">Book Swap</text>
    <text id="subtitle" x="400" y="175" font-family="Arial, sans-serif" font-size="30" fill="#F6C667" text-anchor="middle" xml:lang="es">Intercambio de Libros</text>
  </g>

  <g id="illustration">
    <circle id="illustration-circle" cx="400" cy="440" r="150" fill="#F6C667"/>
    <rect id="book-left" x="300" y="380" width="90" height="130" rx="6" fill="#1F4E5F"/>
    <rect id="book-right" x="410" y="370" width="90" height="140" rx="6" fill="#E07A5F"/>
  </g>

  <g id="details">
    <text id="date-time" x="400" y="680" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1F4E5F" text-anchor="middle">Saturday, March 14 · 10 AM – 1 PM</text>
    <text id="location" x="400" y="730" font-family="Arial, sans-serif" font-size="26" fill="#3D3D3D" text-anchor="middle">Community Library, Room B</text>
    <text id="tagline" x="400" y="770" font-family="Arial, sans-serif" font-size="22" fill="#3D3D3D" text-anchor="middle">Bring a book, take a book · Trae un libro, llévate otro</text>
  </g>

  <g id="cta">
    <rect id="cta-button" x="250" y="820" width="300" height="70" rx="35" fill="#E07A5F"/>
    <text id="cta-label" x="400" y="866" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Free entry</text>
  </g>

  <g id="footer">
    <text id="footer-note" x="400" y="960" font-family="Arial, sans-serif" font-size="18" fill="#7A7A7A" text-anchor="middle">Sample design for demonstration only</text>
  </g>
</svg>
